# ============================================================
# Chatwoot 自托管生产环境 Docker Compose（自定义镜像版）
# 镜像: ghcr.io/dgltsp-cpu/chatwoot:v4.17.4-custom
#   - 基于 Chatwoot v4.17.0 社区版定制（源码构建仓库: dgltsp-cpu/chatwoot-v4）
#   - 已固化进镜像: proxy 附件路由 / 365天有效期 / 图片+视频 inline / 默认去品牌
#   - 因此不再需要挂载 active_storage_url_expiry.rb
# ============================================================

x-chatwoot-base: &chatwoot_base
  image: ghcr.io/dgltsp-cpu/chatwoot:v4.17.4-custom
  env_file: .env
  volumes:
    - storage_data:/app/storage

services:
  rails:
    <<: *chatwoot_base
    depends_on:
      - postgres
      - redis
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']
    restart: always

  sidekiq:
    <<: *chatwoot_base
    depends_on:
      - postgres
      - redis
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    restart: always

  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    env_file: .env
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=chatwoot
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}

  redis:
    image: redis:alpine
    restart: always
    command: ["sh", "-c", "redis-server --requirepass \"$REDIS_PASSWORD\""]
    env_file: .env
    volumes:
      - redis_data:/data
    ports:
      - '127.0.0.1:6379:6379'

volumes:
  storage_data:
  postgres_data:
  redis_data:
